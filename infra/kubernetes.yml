# Template only: create bank-runtime Secret separately, provide external PostgreSQL/Kafka.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eu-fin
spec:
  replicas: 1
  selector:
    matchLabels: {app: eu-fin}
  template:
    metadata:
      labels: {app: eu-fin}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 256Mi}
      containers:
        - name: bank
          image: eu-fin:0.1.0
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
          envFrom: [{secretRef: {name: bank-runtime}}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: eu-fin}
spec:
  selector: {app: eu-fin}
  ports: [{port: 8080, targetPort: 8080}]
