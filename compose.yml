services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["bank-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  registry:
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on: [kafka]
    ports: ["127.0.0.1:8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    restart: on-failure:5
    ports: ["127.0.0.1:8080:8080"]
    environment:
      BANK_DATA_KEY: ${BANK_DATA_KEY:?Set BANK_DATA_KEY}
      BANK_JWT_SECRET: ${BANK_JWT_SECRET:?Set BANK_JWT_SECRET}
      DB_URL: jdbc:postgresql://postgres:5432/bank
      DB_USER: bank
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:29092
      BANK_KAFKA_ENABLED: true
      BANK_STREAMS_ENABLED: true
      SCHEMA_REGISTRY_URL: http://registry:8081
volumes:
  bank-data:
