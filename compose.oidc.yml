# Use with: docker compose -f compose.yml -f compose.oidc.yml up --build
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    ports: ["127.0.0.1:8082:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: lab-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-lab.py}
      KC_HOSTNAME: http://localhost:8082
      DEMO_ALICE_PASSWORD: ${DEMO_ALICE_PASSWORD}
      DEMO_BOB_PASSWORD: ${DEMO_BOB_PASSWORD}
      DEMO_CARLA_PASSWORD: ${DEMO_CARLA_PASSWORD}
      DEMO_DANIEL_PASSWORD: ${DEMO_DANIEL_PASSWORD}
      DEMO_EVA_PASSWORD: ${DEMO_EVA_PASSWORD}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD}
    volumes:
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/eu-fin.json:ro
      - keycloak-data:/opt/keycloak/data
  app:
    depends_on:
      keycloak:
        condition: service_started
    environment:
      BANK_DATA_KEY: ${BANK_DATA_KEY:?Run scripts/init-lab.py}
      BANK_DEMO_DATA_ENABLED: true
      BANK_AUTO_CLEARING_ENABLED: true
      BANK_JWK_SET_URI: http://keycloak:8080/realms/eu-fin/protocol/openid-connect/certs
      BANK_ISSUER: http://localhost:8082/realms/eu-fin
      BANK_OIDC_URL: http://localhost:8082/realms/eu-fin
volumes:
  keycloak-data:
