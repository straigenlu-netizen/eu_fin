name: SonarQube quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sonar:
    name: SonarQube Community and Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: http://127.0.0.1:9000
      SONAR_PROJECT_KEY: eu_fin
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify SonarQube bootstrap
        run: python3 -m unittest discover -s scripts -p test_sonar_ci.py
      - name: Start isolated disposable SonarQube Community
        run: |
          sudo sysctl -w vm.max_map_count=524288
          docker run -d --name sonar-ci --memory=3g \
            --ulimit nofile=131072:131072 --ulimit nproc=8192:8192 \
            -p 127.0.0.1:9000:9000 \
            -e SONAR_WEB_JAVAOPTS='-Xms128m -Xmx512m' \
            -e SONAR_CE_JAVAOPTS='-Xms128m -Xmx512m' \
            -e SONAR_SEARCH_JAVAOPTS='-Xms512m -Xmx512m' \
            sonarqube:26.9.0.129388-community
      - name: Initialise project and short-lived credentials
        run: python3 scripts/sonar_ci.py bootstrap
      - name: Install frontend dependencies when present
        run: |
          if [ -f web-ui/package-lock.json ]; then
            npm ci --prefix web-ui
          fi
      - name: Build, run unit tests and create JaCoCo reports
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Analyse source and enforce Quality Gate
        run: |
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.projectVersion=0.1.0 \
            -Dsonar.maven.scanAll=true \
            '-Dsonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/playwright-report/**,**/test-results/**,**/*.test.*,web-ui/e2e/**' \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
      - name: Export Quality Gate, measures, issues and hotspots
        if: always() && env.SONAR_TOKEN != ''
        run: python3 scripts/sonar_ci.py collect
      - name: Save server diagnostics
        if: always()
        run: |
          mkdir -p target/sonarqube
          docker logs sonar-ci > target/sonarqube/server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: |
            target/sonarqube/
            **/target/site/jacoco/
            **/target/surefire-reports/
          retention-days: 14
      - name: Stop disposable server
        if: always()
        run: docker rm -f sonar-ci || true
