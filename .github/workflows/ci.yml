name: Bank verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check English-only repository content
        run: python3 scripts/check-english.py
      - run: mvn -B -Pcontainers verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-java-21
          path: |
            target/surefire-reports
            target/site/jacoco
            target/performance-results.json
            target/sdd-performance-results.json
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.180.0
      - name: Verify security rules against positive and negative fixtures
        run: semgrep --test security/semgrep
      - name: Scan bank source and fail on findings
        run: semgrep scan --config security/semgrep/java.yml --error --strict --metrics off --sarif --output semgrep.sarif src/main/java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-sarif
          path: semgrep.sarif
          if-no-files-found: warn
  codeql:
    # Public repositories run automatically; private repositories require Code Security and explicit opt-in.
    if: ${{ github.event.repository.private == false || vars.CODEQL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@v3
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          scanners: vuln,secret,misconfig
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B -DskipTests package
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: bash e2e/run-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-e2e
          path: target/browser
